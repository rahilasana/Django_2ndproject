{% extends "base.html" %}

{% block content %}

<div class="min-h-screen bg-gray-100 p-6">

    <div class="flex justify-end mb-6">
        <a
            href="{% url 'logout' %}"
            class="inline-block rounded-lg bg-red-600 px-6 py-3 font-semibold text-white shadow-md transition duration-200 hover:bg-red-700 hover:shadow-lg"
        >
            Logout
        </a>
    </div>

    <div class="flex items-center justify-center">

        <div class="w-full max-w-lg bg-white rounded-xl shadow-lg p-8">

            <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">
                My Profile
            </h1>

            <div class="space-y-4">

                <div class="border-b pb-3">
                    <p class="text-sm text-gray-500">
                        Username
                    </p>

                    <p class="text-lg font-semibold text-gray-800">
                        {{ user.username }}
                    </p>
                </div>

                <div class="border-b pb-3">
                    <p class="text-sm text-gray-500">
                        Email
                    </p>

                    <p class="text-lg font-semibold text-gray-800">
                        {{ user.email }}
                    </p>
                </div>

                <div class="border-b pb-3">
                    <p class="text-sm text-gray-500">
                        First Name
                    </p>

                    <p class="text-lg font-semibold text-gray-800">
                        {{ user.first_name }}
                    </p>
                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
