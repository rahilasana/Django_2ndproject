{% extends "base.html" %}

{% block content %}

<div class="min-h-screen bg-gray-100 flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl p-8">

        <div class="text-center mb-8">

            <h1 class="text-3xl font-bold text-gray-800">
                Add Student
            </h1>

            <p class="text-gray-500 mt-2">
                Enter the student information below
            </p>

        </div>


        <form method="POST">

            {% csrf_token %}


            <div class="mb-5">

                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Student Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter student name"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                >

            </div>


            <div class="mb-5">

                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter student email"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                >

            </div>


            <div class="mb-7">

                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Age
                </label>

                <input
                    type="number"
                    name="age"
                    placeholder="Enter student age"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                >

            </div>


            <button
                type="submit"
                class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition duration-200"
            >
                Add Student
            </button>

        </form>

    </div>

</div>

{% endblock %}
