<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .header {
            width: 100%;
            background-color: #1e1e2f;
            padding: 20px 60px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #ffffff;
            font-size: 28px;
            font-weight: bold;
        }

        .navbar {
            display: flex;
            gap: 30px;
        }

        .navbar a {
            color: #ffffff;
            text-decoration: none;
            font-size: 17px;
            font-weight: 500;
            transition: 0.3s;
        }

        .navbar a:hover {
            color: #6c63ff;
        }

        .header-btn {
            background-color: #6c63ff;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            transition: 0.3s;
        }

        .header-btn:hover {
            background-color: #5148d8;
        }
        .navbar li{
            list-style:none;
        }
        .navbar .active a{
            background-color:red;
            padding:6px;
        }
    </style>
</head>

<body>

<header class="header">

    <div class="logo">
        My Website
    </div>

    <nav class="navbar">
        <li class="{% if request.path == '/' %} active {% endif %}"><a href="{% url 'home' %}">Home</a></li>
        <li class="{% if request.path == '/about/' %} active {% endif %}" ><a href="{% url 'about' %}">About</a></li>
        <li class="{% if request.path == '/services/' %} active {% endif %}"><a href="{% url 'services'%}">Services</a></li>
        <li class="{% if request.path == '/contact/' %} active {% endif %}"><a href="{% url 'contact'%}">Contact</a></li>
    </nav>

    <a href="#" class="header-btn">
        Get Started
    </a>

</header>
