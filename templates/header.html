<header class="header">
  <div class="logo">My Website</div>

  <nav class="navbar">
    <li class="{% if request.path == '/' %} active {% endif %}">
      <a href="{% url 'home' %}">Home</a>
    </li>
    <li class="{% if request.path == '/about/' %} active {% endif %}">
      <a href="{% url 'about' %}">About</a>
    </li>
    <li class="{% if request.path == '/services/' %} active {% endif %}">
      <a href="{% url 'services'%}">Services</a>
    </li>
    <li class="{% if request.path == '/contact/' %} active {% endif %}">
      <a href="{% url 'contact'%}">Contact</a>
    </li>
  </nav>

  <a href="{% url 'students' %}" class="header-btn"> All Students </a>
  <a href="{% url 'register' %}" class="header-btn"> Register your self </a>
  <a href="{% url 'login_view' %}" class="header-btn"> login </a>
  <a href="{% url 'management_home' %}" class="header-btn">management </a>

  <style>
    {% comment %} * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    } {% endcomment %}

    .header {
        width: 100%;
        background-color: #1e1e2f;
        padding: 20px 60px;

        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        color: #ffffff;
        font-size: 28px;
        font-weight: bold;
    
    }

    .navbar {
        display: flex;
        justify-content:center;
        gap: 30px;
        width:40%;
    }

    .navbar a {
        color: #ffffff;
        text-decoration: none;
        font-size: 17px;
        font-weight: 500;
        transition: 0.3s;
        
    }

    .navbar a:hover {
        color: #6c63ff;
    }

    .header-btn {
        background-color: #6c63ff;
        color: white;
        padding: 10px 18px;
        border-radius: 6px;
        text-decoration: none;
        transition: 0.3s;
        
    }

    .header-btn:hover {
        background-color: #5148d8;
    }
    .navbar li{
        list-style:none;
    }
    .navbar .active a{
        background-color:red;
        padding:6px;
        border-radius:5px;
    }
  </style>
</header>
